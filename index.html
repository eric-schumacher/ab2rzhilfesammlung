<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Arbeitsplan 2 - rationale Zahlen - Hilfesammlung</title>
  <style>
    :root{
      --plan-yellow:#F7EAB8;
      --paper:#fffdf6;
      --paper-2:#fff9df;
      --ink:#151515;
      --muted:#665f49;
      --line:#2b2a25;
      --good:#1f7a45;
      --bad:#a73535;
      --shadow:0 8px 20px rgba(73,62,24,.10);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--plan-yellow);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh}
    button{font:inherit}
    .app{width:min(920px,100%);margin:0 auto;padding:clamp(18px,3vw,34px) clamp(14px,3vw,28px) 44px}
    .topbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;min-height:42px}
    .icon-btn{border:1.5px solid rgba(0,0,0,.45);background:rgba(255,255,255,.58);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;min-height:44px}
    .icon-btn:hover{background:rgba(255,255,255,.85)}
    .spacer{flex:1}
    h1{font-size:clamp(28px,5vw,48px);line-height:1.08;text-align:center;margin:18px auto 30px;max-width:850px;letter-spacing:-.6px}
    h2{font-size:clamp(23px,4vw,34px);line-height:1.15;margin:0}
    h3{font-size:clamp(20px,3vw,27px);margin:0}
    .subtitle{text-align:center;color:var(--muted);font-size:16px;margin:-14px 0 26px}
    .stack{display:grid;gap:14px}
    .menu-btn,.task-btn,.part-btn{width:100%;text-align:left;border:1.6px solid rgba(0,0,0,.50);background:var(--paper);border-radius:var(--radius);padding:20px 22px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease,box-shadow .12s ease,background .12s ease}
    .menu-btn:hover,.task-btn:hover,.part-btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(73,62,24,.14);background:white}
    .menu-btn strong,.task-btn strong,.part-btn strong{display:block;font-size:clamp(18px,3vw,24px);line-height:1.2}
    .menu-btn span,.task-btn span,.part-btn span{display:block;margin-top:6px;color:var(--muted);font-size:14px;line-height:1.35}
    .card{background:rgba(255,253,246,.93);border:1.6px solid rgba(0,0,0,.36);border-radius:22px;padding:clamp(20px,4vw,34px);box-shadow:var(--shadow)}
    .task-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}
    .task-head .grow{flex:1}
    .mini-note{display:inline-block;margin-top:8px;padding:6px 9px;border-radius:9px;background:#fff3bd;color:#5f5119;font-size:13px;font-weight:700}
    .source-note{margin:16px 0 0;padding:12px 14px;border-radius:12px;background:#fff1d8;border:1px solid rgba(130,83,0,.28);font-size:14px;line-height:1.4;color:#6d4a12}
    .progress-wrap{margin:18px 0 22px}
    .progress-meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-bottom:7px}
    .progress{height:9px;border-radius:999px;background:rgba(0,0,0,.10);overflow:hidden}
    .progress > div{height:100%;background:#242424;border-radius:999px;transition:width .25s ease}
    .question{font-size:clamp(22px,3.5vw,31px);line-height:1.25;font-weight:800;margin:12px 0 12px}
    .help-row{display:flex;justify-content:center;margin:30px 0 8px}
    .help-row[hidden]{display:none !important}
    .help-btn{border:1.6px solid rgba(0,0,0,.48);background:rgba(255,255,255,.62);border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;min-height:46px;box-shadow:0 4px 12px rgba(0,0,0,.06);transition:transform .1s ease,background .12s ease}
    .help-btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.9)}
    .help-btn[aria-expanded="true"]{background:#fff;color:#111}
    .easy-help{display:none;margin:12px 0 8px;border:1.5px dashed rgba(0,0,0,.42);border-radius:16px;background:rgba(255,255,255,.72);padding:17px 18px 16px;line-height:1.45}
    .easy-help.show{display:block;animation:fadeIn .18s ease}
    .easy-help-title{font-weight:900;font-size:18px;margin-bottom:6px}
    .easy-help-text{font-size:16px}
    .easy-help-note{margin-top:11px;font-size:13px;color:var(--muted);font-weight:700}
    .solution-box{margin:13px 0 6px;padding:13px 14px;border:2px solid rgba(0,0,0,.42);border-radius:13px;background:#fff;text-align:center}
    .solution-label{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:4px}
    .solution-answer{font-size:clamp(20px,3vw,27px);font-weight:900;line-height:1.2}
    .helper-caption{text-align:center;font-size:13px;font-weight:800;color:var(--muted);margin-top:7px}
    .helper-visual{margin:12px auto 2px;max-width:520px;border-radius:13px;background:rgba(255,255,255,.68);padding:9px 10px;border:1px solid rgba(0,0,0,.12)}
    .helper-visual svg{display:block;width:100%;height:auto;overflow:visible}
    .mini-steps{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:7px;align-items:center;text-align:center;font-size:13px;font-weight:800}
    .mini-step{padding:9px 7px;border:1px solid rgba(0,0,0,.24);border-radius:10px;background:white}
    .mini-arrow{font-size:20px;font-weight:900}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
    .thinking{min-height:42px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;margin:14px 0 6px;text-align:center}
    .countdown{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;margin-left:8px;border-radius:50%;border:2px solid rgba(0,0,0,.55);color:#111;background:rgba(255,255,255,.55)}
    .answers{display:grid;gap:11px;margin-top:12px}
    .answer-btn{width:100%;border:1.6px solid rgba(0,0,0,.55);border-radius:14px;background:white;padding:16px 17px;cursor:pointer;text-align:left;font-weight:700;font-size:17px;line-height:1.3;min-height:57px;transition:transform .08s ease,background .12s ease,border-color .12s ease}
    .answer-btn:hover{transform:translateY(-1px);background:#fffaf0}
    .answer-btn:disabled{cursor:default;transform:none}
    .answer-btn.good{border-color:var(--good);background:#e9f7ef;color:#145a32}
    .answer-btn.bad{animation:shake .26s linear;border-color:var(--bad);background:#fff0f0}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
    .feedback{min-height:40px;margin-top:13px;padding:0 2px;font-weight:700;line-height:1.35}
    .feedback.good{color:var(--good)}
    .feedback.bad{color:var(--bad)}
    .success{text-align:center;padding:12px 0 4px}
    .success .star{font-size:56px;line-height:1;margin-bottom:10px}
    .success h3{font-size:30px;margin-bottom:8px}
    .success p{color:var(--muted);font-size:17px;line-height:1.45;max-width:620px;margin:0 auto 20px}
    .primary{border:1.6px solid #111;background:#111;color:white;border-radius:14px;padding:14px 20px;font-weight:800;cursor:pointer;min-height:50px}
    .primary:hover{background:#292929}
    .part-intro{color:var(--muted);line-height:1.5;margin:6px 0 18px}
    .footer{margin-top:28px;text-align:center;color:#746b50;font-size:12px;line-height:1.45}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media (max-width:560px){
      .app{padding-left:12px;padding-right:12px}
      h1{margin-top:8px}
      .menu-btn,.task-btn,.part-btn{padding:17px 16px}
      .card{padding:19px 16px}
      .answer-btn{font-size:16px;padding:14px}
      .topbar{margin-bottom:10px}
    }
  </style>
</head>
<body>
  <main class="app" id="app" aria-live="polite"></main>

    function q(text, options, correct, hint){ return {text, options, correct, hint}; }

    function helpKind(question){
      const s=(question.text+' '+(question.hint||'')).toLowerCase();
      if(/koordinat|x-achse|y-achse|quadrant/.test(s)) return 'coordinates';
      if(/konto|kontostand|einnahm|ausgab|guthaben|€|euro/.test(s)) return 'money';
      if(/temperatur|°c|wärmer|kälter/.test(s)) return 'temperature';
      if(/mitte|halbier|hälfte/.test(s)) return 'middle';
      if(/zahlengerad|zahlenstrahl|links|rechts|abstand|negativ|positiv|vorzeichen|größer|kleiner|vergleich/.test(s)) return 'numberline';
      if(/schritt|änderung|zunahme|abnahme|steigt|fällt|hoch|runter/.test(s)) return 'change';
      if(/klammer|punkt vor strich|multipl|divid|produkt|faktor/.test(s)) return 'calculation';
      return 'general';
    }

    function escapeHtml(value){
      return String(value).replace(/[&<>"']/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
    }

    function easyHelpText(question){
      const kind=helpKind(question);
      const answer=escapeHtml(question.options[question.correct]);
      const hint=escapeHtml(question.hint||'');
      const texts={
        coordinates:'Lies die Aufgabe jetzt ganz geführt: Zuerst gehst du auf der x-Achse nach links oder rechts, danach auf der y-Achse nach unten oder oben. Das Vorzeichen entscheidet jeweils über die Richtung.',
        money:'Behandle jede Buchung wie einen Pfeil: Einnahme = Plus, Ausgabe = Minus. Starte beim angegebenen Betrag und arbeite die Buchungen in der genannten Reihenfolge ab.',
        temperature:'Setze 0 °C als Orientierung. Höher bzw. wärmer bedeutet nach oben/rechts, niedriger bzw. kälter nach unten/links. Dann gehst du genau um den genannten Betrag weiter.',
        middle:'Bestimme zuerst den ganzen Abstand der beiden Randwerte. Teile diesen Abstand durch 2 und gehe von einem Randwert genau diese halbe Strecke in Richtung des anderen.',
        numberline:'Markiere gedanklich zuerst die 0. Negative bzw. kleinere Zahlen liegen links, positive bzw. größere rechts. Danach gehst du nur noch die geforderte Anzahl an Schritten oder vergleichst die Lage.',
        change:'Schreibe Startwert und Veränderung getrennt hin. Plus bedeutet in positive Richtung, Minus in negative Richtung. Führe dann genau diese Bewegung vom Startwert aus.',
        calculation:'Markiere den Rechenschritt, der zuerst ausgeführt werden muss. Rechne diesen Teil aus, setze das Ergebnis wieder ein und gehe dann weiter.',
        general:'Nimm nur die Daten, die du für genau diesen Denkschritt brauchst. Formuliere daraus eine kleine Rechnung oder Entscheidung und prüfe sie direkt.'
      };
      return `${texts[kind]}${hint?`<br><br><strong>Konkreter Hinweis:</strong> ${hint}`:''}<div class="solution-box"><div class="solution-label">Lösung dieses Denkschritts</div><div class="solution-answer">${answer}</div></div>`;
    }

      const answer=escapeHtml(question.options[question.correct]);
      const hint=escapeHtml(question.hint||'');
      if(kind==='coordinates'){
        return `<div class="helper-visual" aria-label="Geführte Skizze eines Koordinatensystems">
          <svg viewBox="0 0 420 175" role="img" aria-label="Erst x, dann y">
            <line x1="48" y1="82" x2="382" y2="82" stroke="currentColor" stroke-width="2"/>
            <line x1="210" y1="138" x2="210" y2="22" stroke="currentColor" stroke-width="2"/>
            <path d="M382 82 l-12 -6 v12 z" fill="currentColor"/><path d="M210 22 l-6 12 h12 z" fill="currentColor"/>
            <text x="386" y="88" font-size="15">x</text><text x="218" y="24" font-size="15">y</text>

          </svg><div class="helper-caption">Ergebnis für diesen Schritt: ${answer}</div></div>`;
      }
      if(kind==='money'){

      }
      if(kind==='temperature'){
        return `<div class="helper-visual" aria-label="Geführte Temperaturskala">
          <svg viewBox="0 0 420 135" role="img" aria-label="Temperatur steigt oder fällt">

            <line x1="210" y1="45" x2="210" y2="89" stroke="currentColor" stroke-width="3"/>

            <path d="M194 91 L103 91" stroke="currentColor" stroke-width="3"/><path d="M103 91 l11 -6 v12 z" fill="currentColor"/>
            <path d="M226 91 L317 91" stroke="currentColor" stroke-width="3"/><path d="M317 91 l-11 -6 v12 z" fill="currentColor"/>

        return `<div class="helper-visual" aria-label="Mitte zwischen zwei Werten"><div class="mini-steps"><div class="mini-step">ganzen Abstand finden</div><div class="mini-arrow">→</div><div class="mini-step">Abstand : 2</div><div class="mini-arrow">→</div><div class="mini-step"><strong>${answer}</strong></div></div><div class="helper-caption">Die Mitte liegt von beiden Randwerten gleich weit entfernt.</div></div>`;
      }
      if(kind==='numberline'){
        return `<div class="helper-visual" aria-label="Geführte Zahlengerade">
          <svg viewBox="0 0 420 125" role="img" aria-label="Links kleiner, rechts größer">
            <line x1="44" y1="62" x2="376" y2="62" stroke="currentColor" stroke-width="3"/>
            <path d="M44 62 l12 -7 v14 z" fill="currentColor"/><path d="M376 62 l-12 -7 v14 z" fill="currentColor"/>
            <line x1="210" y1="45" x2="210" y2="80" stroke="currentColor" stroke-width="3"/>
            <text x="202" y="102" font-size="15">0</text>
            <text x="57" y="38" font-size="14" font-weight="700">kleiner / negativ</text><text x="275" y="38" font-size="14" font-weight="700">größer / positiv</text>
          </svg><div class="helper-caption">Für diesen Denkschritt ist richtig: ${answer}</div></div>`;
      }
      if(kind==='change'){
        return `<div class="helper-visual"><div class="mini-steps"><div class="mini-step">Start</div><div class="mini-arrow">→</div><div class="mini-step">Richtung aus + / −</div><div class="mini-arrow">→</div><div class="mini-step"><strong>${answer}</strong></div></div><div class="helper-caption">${hint}</div></div>`;
      }
      if(kind==='calculation'){

      return `<div class="helper-visual"><div class="mini-steps"><div class="mini-step">Gegebenes markieren</div><div class="mini-arrow">→</div><div class="mini-step">Hinweis nutzen</div><div class="mini-arrow">→</div><div class="mini-step"><strong>${answer}</strong></div></div><div class="helper-caption">${hint}</div></div>`;
    }

    const state = {view:'chapters', chapterId:null, taskId:null, partId:null, index:0, timer:null, interval:null};
    const app = document.getElementById('app');

    function clearTimers(){
      if(state.timer) clearTimeout(state.timer);
      if(state.interval) clearInterval(state.interval);
      state.timer=null; state.interval=null;
    }

    function shuffleWithCorrect(options, correctIndex){
      const items = options.map((text,i)=>({text,correct:i===correctIndex}));
      for(let i=items.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [items[i],items[j]]=[items[j],items[i]]; }
      return items;
    }

    function topbar(backFn, label='Zurück'){
      const bar=document.createElement('div'); bar.className='topbar';
      if(backFn){
        const b=document.createElement('button'); b.className='icon-btn'; b.textContent='← '+label; b.onclick=backFn; bar.appendChild(b);
      }
      const sp=document.createElement('div'); sp.className='spacer'; bar.appendChild(sp);
      const home=document.createElement('button'); home.className='icon-btn'; home.textContent='⌂ Start'; home.onclick=()=>{clearTimers(); state.view='chapters'; state.chapterId=state.taskId=state.partId=null; state.index=0; render();};
      if(state.view!=='chapters') bar.appendChild(home);
      return bar;
    }

    function render(){
      clearTimers();
      app.innerHTML='';
      if(state.view==='chapters') return renderChapters();
      if(state.view==='tasks') return renderTasks();
      if(state.view==='parts') return renderParts();
      if(state.view==='flow') return renderFlow();
    }

    function renderTitle(sub='Tippe auf ein Teilkapitel.'){
      const h=document.createElement('h1'); h.textContent='Arbeitsplan 2 - rationale Zahlen - Hilfesammlung'; app.appendChild(h);
      const p=document.createElement('div'); p.className='subtitle'; p.textContent=sub; app.appendChild(p);
    }

    function renderChapters(){
      renderTitle('');
      const stack=document.createElement('div'); stack.className='stack';
      chapters.forEach(ch=>{
        const b=document.createElement('button'); b.className='menu-btn';
        b.innerHTML=`<strong>${ch.title}</strong><span>${ch.tasks.length} Aufgaben aus dem Arbeitsplan</span>`;
        b.onclick=()=>{state.chapterId=ch.id; state.view='tasks'; render();};
        stack.appendChild(b);
      });
      app.appendChild(stack);
      footer();
    }

    function renderTasks(){
      const ch=chapters.find(c=>c.id===state.chapterId);
      app.appendChild(topbar(()=>{state.view='chapters'; render();},'Teilkapitel'));
      renderTitle(ch.title);
      const stack=document.createElement('div'); stack.className='stack';
      ch.tasks.forEach(t=>{
        const b=document.createElement('button'); b.className='task-btn';
        b.innerHTML=`<strong>${t.label}</strong>${t.note?`<span>${t.note}</span>`:''}`;
        b.onclick=()=>openTask(t.id);
        stack.appendChild(b);
      });
      app.appendChild(stack); footer();
    }

    function openTask(taskId){
      state.taskId=taskId; state.index=0; state.partId=null;
      const flow=flows[taskId];
      state.view=flow.parts?'parts':'flow'; render();
    }

    function taskMeta(){
      for(const ch of chapters){
        const t=ch.tasks.find(x=>x.id===state.taskId); if(t) return {ch,t};
      }
      return null;
    }

    function renderParts(){
      const meta=taskMeta(), flow=flows[state.taskId];
      app.appendChild(topbar(()=>{state.view='tasks'; render();},'Aufgaben'));
      const h=document.createElement('h1'); h.textContent=meta.t.label; app.appendChild(h);
      const p=document.createElement('div'); p.className='subtitle'; p.textContent='Welche Teilaufgabe brauchst du?'; app.appendChild(p);
      if(flow.sourceWarning){ const n=document.createElement('div'); n.className='source-note'; n.textContent=flow.sourceWarning; app.appendChild(n); }
      const stack=document.createElement('div'); stack.className='stack'; stack.style.marginTop='16px';
      Object.entries(flow.parts).forEach(([id,part])=>{
        const b=document.createElement('button'); b.className='part-btn';
        b.innerHTML=`<strong>${part.title}</strong><span>${part.focus}</span>`;
        b.onclick=()=>{state.partId=id; state.index=0; state.view='flow'; render();};
        stack.appendChild(b);
      });
      app.appendChild(stack); footer();
    }

    function currentFlow(){
      const root=flows[state.taskId];
      return state.partId ? root.parts[state.partId] : root;
    }

    function renderFlow(){
      const meta=taskMeta(); const root=flows[state.taskId]; const flow=currentFlow();
      const back=()=>{ if(root.parts){state.view='parts'; state.index=0; render();} else {state.view='tasks'; state.index=0; render();} };
      app.appendChild(topbar(back, root.parts?'Teilaufgaben':'Aufgaben'));

      const card=document.createElement('section'); card.className='card';
      const head=document.createElement('div'); head.className='task-head';
      const grow=document.createElement('div'); grow.className='grow';
      const h=document.createElement('h2'); h.textContent=meta.t.label+(state.partId?` – ${flow.title}`:''); grow.appendChild(h);
      if(meta.t.note){ const n=document.createElement('div'); n.className='mini-note'; n.textContent=meta.t.note; grow.appendChild(n); }
      head.appendChild(grow); card.appendChild(head);
      if(root.sourceWarning){ const n=document.createElement('div'); n.className='source-note'; n.textContent=root.sourceWarning; card.appendChild(n); }
      const intro=document.createElement('p'); intro.className='part-intro'; intro.textContent=flow.focus; card.appendChild(intro);

      if(state.index>=flow.questions.length){
        const s=document.createElement('div'); s.className='success';
        s.innerHTML=`<div class="star">★</div><h3>Hilfeschritte geschafft!</h3><p>Du hast dich selbst bis zur entscheidenden Antwort vorgearbeitet. Übertrage jetzt deinen Lösungsweg sauber ins Heft bzw. kontrolliere deine Buchaufgabe.</p>`;
        const b=document.createElement('button'); b.className='primary'; b.textContent='Zur Aufgabenübersicht';
        b.onclick=()=>{state.view='tasks'; state.index=0; state.partId=null; render();}; s.appendChild(b); card.appendChild(s); app.appendChild(card); footer(); return;
      }

      const total=flow.questions.length, current=state.index+1;
      const prog=document.createElement('div'); prog.className='progress-wrap';
      prog.innerHTML=`<div class="progress-meta"><span>Denkschritt ${current} von ${total}</span><span>${Math.round((state.index/total)*100)} %</span></div><div class="progress"><div style="width:${(state.index/total)*100}%"></div></div>`;
      card.appendChild(prog);

      const question=flow.questions[state.index];
      const qEl=document.createElement('div'); qEl.className='question'; qEl.textContent=question.text; card.appendChild(qEl);

      const think=document.createElement('div'); think.className='thinking'; card.appendChild(think);
      const answers=document.createElement('div'); answers.className='answers'; card.appendChild(answers);
      const feedback=document.createElement('div'); feedback.className='feedback'; card.appendChild(feedback);

      const helpRow=document.createElement('div'); helpRow.className='help-row'; helpRow.hidden=true;
      const helpBtn=document.createElement('button'); helpBtn.className='help-btn'; helpBtn.type='button'; helpBtn.textContent='❓ Ich verstehe die Frage nicht'; helpBtn.setAttribute('aria-expanded','false');
      helpRow.appendChild(helpBtn); card.appendChild(helpRow);
      const easy=document.createElement('div'); easy.className='easy-help';
      easy.innerHTML=`<div class="easy-help-title">Ausführliche Hilfe:</div><div class="easy-help-text">${easyHelpText(question)}</div>${helperVisual(question)}`;
      card.appendChild(easy);
      helpBtn.onclick=()=>{
        const open=!easy.classList.contains('show');
        easy.classList.toggle('show',open);
        helpBtn.setAttribute('aria-expanded',open?'true':'false');
        helpBtn.textContent=open?'Hilfe wieder ausblenden':'❓ Ich verstehe die Frage nicht';
        if(open) setTimeout(()=>easy.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
      };

      app.appendChild(card); footer();

      let remaining=5;
      think.innerHTML=`Denk erst selbst nach. Antwortmöglichkeiten in <span class="countdown">${remaining}</span>`;
      state.interval=setInterval(()=>{
        remaining--;
        const c=think.querySelector('.countdown'); if(c) c.textContent=Math.max(remaining,0);
        if(remaining<=0){clearInterval(state.interval); state.interval=null;}
      },1000);
      state.timer=setTimeout(()=>{
        state.timer=null;
        think.textContent='Wähle jetzt die Antwort, die zu deinem Denkweg passt.';
        showAnswers(question, answers, feedback);
        helpRow.hidden=false;
      },5000);
    }

    function showAnswers(question, container, feedback){
      const items=shuffleWithCorrect(question.options, question.correct);
      items.forEach(item=>{
        const b=document.createElement('button'); b.className='answer-btn'; b.textContent=item.text;
        b.onclick=()=>{
          if(item.correct){
            Array.from(container.children).forEach(x=>x.disabled=true);
            b.classList.add('good'); feedback.className='feedback good'; feedback.textContent='Richtig gedacht. Nächster Denkschritt …';
            setTimeout(()=>{state.index++; render();},700);
          }else{
            b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad');
            feedback.className='feedback bad'; feedback.textContent='Noch nicht. '+question.hint;
          }
        };
        container.appendChild(b);
      });
    }

    function footer(){
      // bewusst leer – keine technischen oder erklärenden Metatexte in der Schüleransicht
    }

    render();
  })();
  </script>
